<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · Valenbot</title><link rel="stylesheet" href="/css/workbench.css"></head>
<body class="login-body"><main class="login-shell"><section class="login-brand"><span class="eyebrow">ROBOT LIFECYCLE MANAGEMENT</span><div class="wordmark">Valenbot<span>®</span></div><h1>每一个编号，<br>都有完整的来历。</h1><p>从生产装配到交付维护，<br>让机器人的每一次变化都有据可查。</p><div class="brand-grid" aria-hidden="true"><span>SN</span><i></i><span>QC</span><i></i><span>CARE</span></div><small>工业工作台 / Excel 导入与 HTTPS 版 2.3</small></section><section class="login-form"><span class="eyebrow">WELCOME BACK</span><h2>登录工作台</h2><p class="muted">使用分配的账号访问对应的机器人信息。</p><form th:action="@{/login}" method="post"><p th:if="${param.error}" class="error" role="alert">账号、密码不正确，或账号已停用。</p><p th:if="${param.logout}" class="notice">已安全退出。</p><label>账号<input name="username" autocomplete="username" required autofocus maxlength="64"></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary" type="submit">登录工作台 <span aria-hidden="true">→</span></button></form><p class="login-note">按角色开放功能与字段。<br>扫码后也会使用您当前账号的查看权限。</p></section></main></body></html>
