spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${VALENBOT_DB_URL:jdbc:postgresql://127.0.0.1:5432/robot_sn_v2}
    username: ${VALENBOT_DB_USER:robot_v2}
    password: ${VALENBOT_DB_PASSWORD}
  flyway:
    enabled: true
server:
  address: 0.0.0.0
  port: ${VALENBOT_PORT:8082}
  servlet:
    session:
      cookie:
        name: ${VALENBOT_SESSION_COOKIE:VALENBOT_V2_SESSION_${VALENBOT_PORT:8082}}
        http-only: true
        secure: ${VALENBOT_COOKIE_SECURE:false}
        same-site: lax
      timeout: 60m
  error:
    include-message: never
valenbot:
  http-redirect-port: ${VALENBOT_HTTP_PORT:8082}
  public-url: ${VALENBOT_PUBLIC_URL:http://127.0.0.1:8082}
  bootstrap-file: ${VALENBOT_BOOTSTRAP_FILE:}
